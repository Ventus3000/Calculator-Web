<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Calculator</title>
</head>
<body>
    <div class="calculator">
        <input class="numbers_container output" value="" disabled></input>
        <input class="result_container output" value="" disabled></input>
        <div class="button del special">C</div>
        <div class="button back_space"><--</div>
        <div class="button operator">÷</div>
        <div class="button number">7</div>
        <div class="button number">8</div>
        <div class="button number">9</div>
        <div class="button operator">x</div>
        <div class="button number">4</div>
        <div class="button number">5</div>
        <div class="button number">6</div>
        <div class="button operator">-</div>
        <div class="button number">1</div>
        <div class="button number">2</div>
        <div class="button number">3</div>
        <div class="button operator">+</div>
        <div class="button dot">.</div>
        <div class="button number">0</div>
        <div class="button assignment special">=</div>
    </div>
    <div class="mem">
        <p>Chronology</p>
        <input class="cell" id="0" disabled></input>
        <input class="cell" id="1" disabled></input>
        <input class="cell" id="2" disabled></input>
        <input class="cell" id="3" disabled></input>
        <input class="cell" id="4" disabled></input>
        <input class="cell" id="5" disabled></input>
        <input class="cell" id="6" disabled></input>
    </div>
    <script src="scripts/index.js"></script>
</body>
</html>
